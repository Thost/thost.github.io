<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hoh Rain Forest — Trevor Host</title>

  <link rel="stylesheet" href="../../libs/Potree/build/potree/potree.css">
  <link rel="stylesheet" href="../../libs/Potree/libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" href="../../libs/Potree/libs/openlayers3/ol.css">
  <link rel="stylesheet" href="../../libs/Potree/libs/spectrum/spectrum.css">
  <link rel="stylesheet" href="../../libs/Potree/libs/jstree/themes/mixed/style.css">

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }

    #back-link {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 9999;
      background: rgba(15, 17, 23, 0.85);
      border: 1px solid #2a3050;
      color: #38bdf8;
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
    }
    #back-link:hover { background: rgba(56, 189, 248, 0.15); }

    #unit-toggle {
      position: fixed;
      top: 1rem;
      right: 7.5rem;
      z-index: 9999;
      display: flex;
      background: rgba(15, 17, 23, 0.85);
      border: 1px solid #2a3050;
      border-radius: 4px;
      overflow: hidden;
      backdrop-filter: blur(6px);
      font-size: 0.85rem;
      font-weight: 500;
    }
    #unit-toggle button {
      background: none;
      border: none;
      color: #8b9ab5;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    #unit-toggle button.active {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }
    #unit-toggle button:hover:not(.active) { color: #cbd5e1; }
    #unit-toggle .sep { width: 1px; background: #2a3050; }

    #attribution {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 9999;
      background: rgba(15, 17, 23, 0.75);
      border: 1px solid #2a3050;
      color: #8b9ab5;
      padding: 0.35rem 0.7rem;
      border-radius: 4px;
      font-size: 0.72rem;
      line-height: 1.4;
      max-width: 420px;
      text-align: right;
      backdrop-filter: blur(6px);
    }
    #attribution a { color: #38bdf8; text-decoration: none; }
    #attribution a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <script src="../../libs/Potree/libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="../../libs/Potree/libs/spectrum/spectrum.js"></script>
  <script src="../../libs/Potree/libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="../../libs/Potree/libs/other/BinaryHeap.js"></script>
  <script src="../../libs/Potree/libs/tween/tween.min.js"></script>
  <script src="../../libs/Potree/libs/d3/d3.js"></script>
  <script src="../../libs/Potree/libs/proj4/proj4.js"></script>
  <script src="../../libs/Potree/libs/openlayers3/ol.js"></script>
  <script src="../../libs/Potree/libs/i18next/i18next.js"></script>
  <script src="../../libs/Potree/libs/jstree/jstree.js"></script>
  <script src="../../libs/Potree/libs/copc/index.js"></script>
  <script src="../../libs/Potree/build/potree/potree.js"></script>
  <script src="../../libs/Potree/libs/plasio/js/laslaz.js"></script>

  <a href="../../index.html" id="back-link">← Portfolio</a>

  <div id="unit-toggle">
    <button id="unit-m">m</button>
    <div class="sep"></div>
    <button id="unit-ft" class="active">ft</button>
  </div>

  <div id="attribution">
    Data: Washington Dept. of Natural Resources, , accessed 2026-04-23,
    <a href="https://lidarportal.dnr.wa.gov/" target="_blank" rel="noopener">lidarportal.dnr.wa.gov/</a>
  </div>

  <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
    <div id="potree_render_area"></div>
    <div id="potree_sidebar_container"></div>
  </div>

  <script type="module">
    import * as THREE from "../../libs/Potree/libs/three.js/build/three.module.js";

    window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(10_000_000);
    viewer.setBackground("gradient");
    viewer.setDescription("Hoh Rain Forest — Olympic National Park, WA");

    viewer.loadGUI(() => {
      viewer.setLanguage("en");
      $("#menu_scene").next().show();
      if (window.innerWidth > 768) viewer.toggleSidebar();
    });

    const FT_TO_M = 0.3048;
    let unitsMeters = false;
    let currentScale = 1.0;
    let displayUnit = "ft";

    function fixLabelUnit(t) {
      if (displayUnit === "m") return t;
      const u = displayUnit;
      return t
        .replace(/ m³/g, ` ${u}³`)
        .replace(/ m²/g, ` ${u}²`)
        .replace(/ m(\s|$)/g, ` ${u}$1`);
    }

    // --- Path 1: CSS2D / HTML labels ---
    // Potree COPC builds often render measurement labels as HTML overlays via
    // CSS2DRenderer. A MutationObserver intercepts every DOM text write so there
    // is no race with Potree's render loop regardless of build variant.
    const _lblObserver = new MutationObserver(muts => {
      if (displayUnit === "m") return;
      for (const mut of muts) {
        if (mut.type === "characterData") {
          const v = mut.target.nodeValue;
          if (/ m(?:[²³]|\s|$)/.test(v)) mut.target.nodeValue = fixLabelUnit(v);
        } else {
          for (const node of mut.addedNodes) {
            if (node.nodeType !== Node.ELEMENT_NODE) continue;
            node.querySelectorAll("*").forEach(el => {
              if (el.childElementCount) return;
              const t = el.textContent;
              if (/ m(?:[²³]|\s|$)/.test(t)) el.textContent = fixLabelUnit(t);
            });
          }
        }
      }
    });
    _lblObserver.observe(document.getElementById("potree_render_area"), {
      subtree: true, childList: true, characterData: true
    });

    // --- Path 2: Three.js TextSprite labels ---
    // For canvas-based sprites, intercept the `text` setter on each instance
    // (checking the instance itself AND the full prototype chain for the descriptor)
    // so Potree's own render-loop writes are corrected at the source.
    function patchLabelChild(child) {
      if (child._unitPatched || !('text' in child)) return;
      let desc, p = child;
      while (p) {
        desc = Object.getOwnPropertyDescriptor(p, 'text');
        if (desc) break;
        p = Object.getPrototypeOf(p);
      }
      if (!desc) return;
      child._unitPatched = true;
      if (desc.set) {
        const { set: oSet, get: oGet } = desc;
        Object.defineProperty(child, 'text', {
          get() { return oGet ? oGet.call(this) : undefined; },
          set(val) { oSet.call(this, fixLabelUnit(val)); },
          configurable: true
        });
      } else if (desc.writable !== false) {
        child._textBk = child.text;
        Object.defineProperty(child, 'text', {
          get() { return this._textBk; },
          set(val) {
            this._textBk = fixLabelUnit(val);
            if (typeof this.update === 'function') this.update();
          },
          configurable: true
        });
      }
    }

    (function patchLabelsLoop() {
      viewer.scene.measurements.forEach(m => m.traverse(patchLabelChild));
      requestAnimationFrame(patchLabelsLoop);
    })();

    function scaleGeometryBuffer(child, ratio) {
      if (!child.geometry || !child.geometry.attributes) return;
      const pos = child.geometry.attributes.position;
      if (!pos) return;
      for (let i = 0; i < pos.array.length; i++) pos.array[i] *= ratio;
      pos.needsUpdate = true;
      child.geometry.boundingBox = null;
      child.geometry.boundingSphere = null;
    }

    function setUnitScale() {
      const newScale = unitsMeters ? FT_TO_M : 1.0;
      const ratio = newScale / currentScale;

      viewer.scene.pointclouds.forEach(pc => pc.scale.set(newScale, newScale, newScale));

      viewer.scene.measurements.forEach(m => {
        m.points.forEach(p => p.position.multiplyScalar(ratio));
      });

      viewer.scene.profiles.forEach(prof => {
        // Update path data read by the profile window
        prof.points.forEach(p => p.multiplyScalar(ratio));
        prof.width *= ratio;

        prof.children.forEach(c => {
          const gtype = (c.geometry && c.geometry.type) || "";
          if (gtype.toLowerCase().includes("sphere")) {
            // Sphere markers: move position, leave geometry (unit sphere) alone
            c.position.multiplyScalar(ratio);
          } else {
            // Line/box children: vertex coords are in the geometry buffer, not position
            scaleGeometryBuffer(c, ratio);
          }
        });
      });

      viewer.scene.volumes.forEach(v => {
        v.position.multiplyScalar(ratio);
        v.scale.multiplyScalar(ratio);
      });

      displayUnit = unitsMeters ? "m" : "ft";
      currentScale = newScale;
      document.getElementById("unit-m").classList.toggle("active", unitsMeters);
      document.getElementById("unit-ft").classList.toggle("active", !unitsMeters);
      viewer.fitToScreen(0.5);
    }

    document.getElementById("unit-m").addEventListener("click", () => { unitsMeters = true;  setUnitScale(); });
    document.getElementById("unit-ft").addEventListener("click", () => { unitsMeters = false; setUnitScale(); });

    const cloudSettings = e => {
      const mat = e.pointcloud.material;
      mat.size = 1;
      mat.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      mat.shape = Potree.PointShape.CIRCLE;
      mat.activeAttributeName = "elevation";

      const scheme = JSON.parse(JSON.stringify(Potree.ClassificationScheme.DEFAULT));
      scheme[7].visible = false;
      scheme[12].visible = false;
      viewer.setClassifications(scheme);

      setUnitScale(); // apply current unit selection to newly loaded cloud
    };    
    
    Potree.loadPointCloud("https://pub-e61a4aff6d73468ebe0aafe721061375.r2.dev/HohRainForest/HohRainForest_2022.copc.laz", "Hoh_2022", e => {
      viewer.scene.addPointCloud(e.pointcloud);
      cloudSettings(e);
      viewer.fitToScreen(0.5);
    });

    Potree.loadPointCloud("https://pub-e61a4aff6d73468ebe0aafe721061375.r2.dev/HohRainForest/HohRainForest2013.copc.laz", "Hoh_2013", e => {
      viewer.scene.addPointCloud(e.pointcloud);
      cloudSettings(e);
      viewer.fitToScreen(0.5);
    });


  </script>
</body>
</html>
