<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DATASET_NAME — Trevor Host</title>

  <!--
    SETUP INSTRUCTIONS
    ==================
    1. Copy this folder to pointclouds/your-project-name/
    2. Run: PotreeConverter.exe input.laz -o pointclouds/your-project-name
    3. Update DATASET_NAME in <title> and viewer.setDescription() below
    4. Update the Potree.loadPointCloud() URL to your R2 path
  -->

  <link rel="stylesheet" href="../../libs/Potree/build/potree/potree.css">
  <link rel="stylesheet" href="../../libs/Potree/libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" href="../../libs/Potree/libs/openlayers3/ol.css">
  <link rel="stylesheet" href="../../libs/Potree/libs/spectrum/spectrum.css">
  <link rel="stylesheet" href="../../libs/Potree/libs/jstree/themes/mixed/style.css">

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }

    #back-link {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 9999;
      background: rgba(15, 17, 23, 0.85);
      border: 1px solid #2a3050;
      color: #38bdf8;
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
    }
    #back-link:hover { background: rgba(56, 189, 248, 0.15); }
  </style>
</head>
<body>
  <script src="../../libs/Potree/libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="../../libs/Potree/libs/spectrum/spectrum.js"></script>
  <script src="../../libs/Potree/libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="../../libs/Potree/libs/other/BinaryHeap.js"></script>
  <script src="../../libs/Potree/libs/tween/tween.min.js"></script>
  <script src="../../libs/Potree/libs/d3/d3.js"></script>
  <script src="../../libs/Potree/libs/proj4/proj4.js"></script>
  <script src="../../libs/Potree/libs/openlayers3/ol.js"></script>
  <script src="../../libs/Potree/libs/i18next/i18next.js"></script>
  <script src="../../libs/Potree/libs/jstree/jstree.js"></script>
  <script src="../../libs/Potree/build/potree/potree.js"></script>
  <script src="../../libs/Potree/libs/plasio/js/laslaz.js"></script>

  <a href="../../index.html" id="back-link">← Portfolio</a>

  <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
    <div id="potree_render_area"></div>
    <div id="potree_sidebar_container"></div>
  </div>

  <script type="module">
    import * as THREE from "../../libs/Potree/libs/three.js/build/three.module.js";

    window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(10_000_000);
    viewer.setBackground("gradient");
    viewer.setDescription("DATASET_NAME");

    viewer.loadGUI(() => {
      viewer.setLanguage("en");
      $("#menu_scene").next().show();
      if (window.innerWidth > 768) viewer.toggleSidebar();
    });

    Potree.loadPointCloud("https://YOUR-R2-URL/DATASET_NAME/metadata.json", "pointcloud", e => {
      viewer.scene.addPointCloud(e.pointcloud);

      const mat = e.pointcloud.material;
      mat.size = 1;
      mat.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      mat.shape = Potree.PointShape.SQUARE;
      mat.colorType = Potree.PointColorType.HEIGHT;

      viewer.fitToScreen();
    });
  </script>
</body>
</html>
