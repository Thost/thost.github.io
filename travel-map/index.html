<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trevor Host — places visited">
  <title>Travel Map — Trevor Host</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .map-wrap {
      padding: 2.5rem 0 3rem;
      flex: 1;
    }
    #map-svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      border: 1px solid #2a3050;
      background: #0a0e18;
    }
    .region {
      stroke: #2a3050;
      stroke-width: 0.5px;
    }
    .legend {
      display: flex;
      gap: 2rem;
      justify-content: center;
      align-items: center;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #8b9dc3;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      border: 1px solid #2a3050;
    }
    .stats {
      text-align: center;
      font-size: 0.82rem;
      color: #8b9dc3;
      margin-top: 0.6rem;
    }
    .stats strong {
      color: #38bdf8;
    }
    .map-title {
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }
    .world-section {
      padding: 0 0 3rem;
    }
    #world-svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      border: 1px solid #2a3050;
    }
    .city { cursor: default; }
    #city-tooltip {
      position: fixed;
      display: none;
      background: #1a1f2e;
      border: 1px solid #2a3050;
      color: #e2e8f0;
      font-size: 0.75rem;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <div class="site-title">
          <a href="../index.html">Trevor Host</a>
          <span class="site-tagline">LiDAR Point Cloud Portfolio</span>
        </div>
        <nav class="site-nav">
          <a href="../index.html">Portfolio</a>
          <a href="../blog/index.html">Blog</a>
          <a href="index.html" class="active">Travel Map</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Travel Map</h1>
        <p>Places I've visited — US states, Canadian provinces, and countries.</p>
      </div>
    </section>

    <section class="map-wrap">
      <div class="container">
        <h2 class="map-title">North America</h2>
        <svg id="map-svg" viewBox="0 0 960 580"></svg>
        <div class="legend">
          <div class="legend-item">
            <div class="swatch" style="background:#38bdf8"></div>
            <span>Visited</span>
          </div>
          <div class="legend-item">
            <div class="swatch" style="background:#1a1f2e"></div>
            <span>Not yet</span>
          </div>
          <div class="legend-item">
            <svg width="14" height="14" style="flex-shrink:0"><circle cx="7" cy="7" r="2.5" fill="#2563eb" stroke="#0f1117" stroke-width="0.6"/></svg>
            <span>Cities visited</span>
          </div>
          <div class="legend-item">
            <svg width="14" height="14" style="flex-shrink:0"><circle cx="7" cy="7" r="3.5" fill="#f8fafc" stroke="#0f1117" stroke-width="0.8"/></svg>
            <span>Places lived</span>
          </div>
        </div>
        <div id="city-tooltip"></div>
        <p class="stats" id="stats"></p>
      </div>
    </section>

    <section class="world-section">
      <div class="container">
        <h2 class="map-title">World</h2>
        <svg id="world-svg" viewBox="0 0 960 500"></svg>
        <p class="stats" id="world-stats"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Trevor Host &middot; <a href="../blog/index.html">Blog</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script>
    /* ── Places visited — edit this set ─────────────────────────────────────
       Add two-letter postal codes for each state / province / territory.
       US:     AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME
               MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI
               SC SD TN TX UT VT VA WA WV WI WY
       Canada: AB BC MB NB NL NT NS NU ON PE QC SK YT
    ─────────────────────────────────────────────────────────────────────── */
    const visited = new Set([
       "WA", "OR", "MN", "FL", "WI", "GA", "NC", "SC", "NY", "KY",
       "CA", "NV", "TX", "TN", "IL", "IN", "OH", "PA", "MA", "ME",
       "ND", "SD", "UT", "NJ", "NH", "AL", "AZ", "CO", "HI", "VA",
       "MI", "IA", "MO", "NE", "CT", "RI",
       "AB", "MB", "NS", "ON", "BC"
    ]);

    const fipsToCode = {
      "1":"AL","2":"AK","4":"AZ","5":"AR","6":"CA","8":"CO","9":"CT",
      "10":"DE","11":"DC","12":"FL","13":"GA","15":"HI","16":"ID",
      "17":"IL","18":"IN","19":"IA","20":"KS","21":"KY","22":"LA",
      "23":"ME","24":"MD","25":"MA","26":"MI","27":"MN","28":"MS",
      "29":"MO","30":"MT","31":"NE","32":"NV","33":"NH","34":"NJ",
      "35":"NM","36":"NY","37":"NC","38":"ND","39":"OH","40":"OK",
      "41":"OR","42":"PA","44":"RI","45":"SC","46":"SD","47":"TN",
      "48":"TX","49":"UT","50":"VT","51":"VA","53":"WA","54":"WV",
      "55":"WI","56":"WY"
    };

    const W = 960, H = 580;
    const projection = d3.geoAlbers()
      .rotate([100, 0])
      .center([0, 46])
      .parallels([38, 62])
      .scale(700)
      .translate([W / 2, H / 2]);

    const path = d3.geoPath(projection);
    const svg  = d3.select("#map-svg");

    Promise.all([
      d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"),
      d3.json("https://gist.githubusercontent.com/Brideau/2391df60938462571ca9/raw/f5a1f3b47ff671eaf2fb7e7b798bacfc6962606a/canadaprovtopo.json"),
      d3.json("https://cdn.jsdelivr.net/npm/sane-topojson/dist/north-america_110m.json"),
    ]).then(([usData, caData, naData]) => {
      const states    = topojson.feature(usData, usData.objects.states).features;
      const provinces = topojson.feature(caData, caData.objects.canadaprov).features;

      svg.selectAll(".state")
        .data(states)
        .join("path")
        .attr("class", "region")
        .attr("d", path)
        .attr("fill", d => visited.has(fipsToCode[String(+d.id)]) ? "#38bdf8" : "#1a1f2e");

      svg.selectAll(".province")
        .data(provinces)
        .join("path")
        .attr("class", "region")
        .attr("d", path)
        .attr("fill", d => visited.has(d.id.slice(3)) ? "#38bdf8" : "#1a1f2e");

      svg.selectAll(".lake")
        .data(topojson.feature(naData, naData.objects.lakes).features)
        .join("path")
        .attr("class", "lake")
        .attr("d", path)
        .attr("fill", "#0a0e18")
        .attr("stroke", "#2a3050")
        .attr("stroke-width", 0.5);

      const visitedCities = [
        { name: "Miami",            lat:  25.762, lon:  -80.192 },
        { name: "Orlando",          lat:  28.538, lon:  -81.379 },
        { name: "Gainesville",      lat:  29.652, lon:  -82.325 },
        { name: "Tallahassee",      lat:  30.452, lon:  -84.281 },
        { name: "Pensacola",        lat:  30.421, lon:  -87.217 },
        { name: "Tampa",            lat:  27.951, lon:  -82.457 },
        { name: "Cocoa Beach",      lat:  28.320, lon:  -80.608 },
        { name: "Savannah",         lat:  32.084, lon:  -81.100 },
        { name: "Atlanta",          lat:  33.749, lon:  -84.388 },
        { name: "Andalusia",        lat:  31.310, lon:  -86.484 },
        { name: "Montgomery",       lat:  32.367, lon:  -86.300 },
        { name: "Mobile",           lat:  30.695, lon:  -88.040 },
        { name: "Asheville",        lat:  35.595, lon:  -82.552 },
        { name: "Charlotte",        lat:  35.227, lon:  -80.843 },
        { name: "Greenville",       lat:  34.853, lon:  -82.394 },
        { name: "Nashville",        lat:  36.163, lon:  -86.782 },
        { name: "Chattanooga",      lat:  35.046, lon:  -85.310 },
        { name: "Paducah",          lat:  37.083, lon:  -88.600 },
        { name: "New York",         lat:  40.713, lon:  -74.006 },
        { name: "Buffalo",          lat:  42.886, lon:  -78.878 },
        { name: "Philadelphia",     lat:  39.953, lon:  -75.165 },
        { name: "Bar Harbor",       lat:  44.388, lon:  -68.204 },
        { name: "Boston",           lat:  42.360, lon:  -71.059 },
        { name: "Cleveland",        lat:  41.499, lon:  -81.694 },
        { name: "Detroit",          lat:  42.331, lon:  -83.046 },
        { name: "Kalamazoo",        lat:  42.292, lon:  -85.587 },
        { name: "Chicago",          lat:  41.878, lon:  -87.630 },
        { name: "Fort Wayne",       lat:  41.079, lon:  -85.139 },
        { name: "Milwaukee",        lat:  43.039, lon:  -87.907 },
        { name: "Manitowoc",        lat:  44.089, lon:  -87.656 },
        { name: "Green Bay",        lat:  44.519, lon:  -88.020 },
        { name: "Eau Claire",       lat:  44.811, lon:  -91.499 },
        { name: "Rice Lake",        lat:  45.506, lon:  -91.738 },
        { name: "Bayfield",         lat:  46.813, lon:  -90.822 },
        { name: "Cedar Rapids",     lat:  41.978, lon:  -91.666 },
        { name: "Mankato",          lat:  44.164, lon:  -93.999 },
        { name: "Willmar",          lat:  45.122, lon:  -95.043 },
        { name: "Winona",           lat:  44.050, lon:  -91.639 },
        { name: "Grand Rapids",     lat:  47.238, lon:  -93.528 },
        { name: "Bemidji",          lat:  47.474, lon:  -94.880 },
        { name: "Eveleth",          lat:  47.463, lon:  -92.540 },
        { name: "Lutsen",           lat:  47.652, lon:  -90.688 },
        { name: "Fargo",            lat:  46.877, lon:  -96.790 },
        { name: "Grand Forks",      lat:  47.925, lon:  -97.033 },
        { name: "Sioux Falls",      lat:  43.545, lon:  -96.731 },
        { name: "Winnipeg",         lat:  49.895, lon:  -97.138 },
        { name: "Sault Ste. Marie", lat:  46.514, lon:  -84.336 },
        { name: "Toronto",          lat:  43.653, lon:  -79.383 },
        { name: "Halifax",          lat:  44.649, lon:  -63.575 },
        { name: "Denver",           lat:  39.739, lon: -104.990 },
        { name: "Fort Collins",     lat:  40.585, lon: -105.084 },
        { name: "Breckenridge",     lat:  39.482, lon: -106.038 },
        { name: "Salt Lake City",   lat:  40.761, lon: -111.891 },
        { name: "Las Vegas",        lat:  36.170, lon: -115.140 },
        { name: "Phoenix",          lat:  33.448, lon: -112.074 },
        { name: "Tucson",           lat:  32.223, lon: -110.975 },
        { name: "Flagstaff",        lat:  35.198, lon: -111.651 },
        { name: "Los Angeles",      lat:  34.052, lon: -118.244 },
        { name: "San Francisco",    lat:  37.775, lon: -122.419 },
        { name: "Truckee",          lat:  39.328, lon: -120.183 },
        { name: "Portland",         lat:  45.523, lon: -122.677 },
        { name: "Seattle",          lat:  47.606, lon: -122.332 },
        { name: "Olympia",          lat:  47.038, lon: -122.901 },
        { name: "Aberdeen",         lat:  46.975, lon: -123.815 },
        { name: "Vancouver",        lat:  49.283, lon: -123.121 },
        { name: "Banff",            lat:  51.178, lon: -115.571 },
        { name: "Edmonton",         lat:  53.546, lon: -113.494 },
        { name: "Calgary",          lat:  51.045, lon: -114.072 },
        { name: "Houston",          lat:  29.760, lon:  -95.370 },
        { name: "Lufkin",           lat:  31.338, lon:  -94.729 },
        { name: "Blacksburg",       lat:  37.230, lon:  -80.415 },
        { name: "Waycross",         lat:  31.214, lon:  -82.356 },
        { name: "Devils Lake",      lat:  43.429, lon:  -89.732 },
        { name: "Erie",             lat:  42.129, lon:  -80.085 },
        { name: "Brandon",          lat:  49.833, lon:  -99.950 },
        { name: "Ely",              lat:  47.903, lon:  -91.867 },
        { name: "Rainy Lake",       lat:  48.637, lon:  -93.031 },
        { name: "St. Louis",        lat:  38.627, lon:  -90.198 },
        { name: "Omaha",            lat:  41.256, lon:  -95.934 },
        { name: "Bismarck",         lat:  46.808, lon:  -100.784 },
        

      ];

      svg.selectAll(".visited-city")
        .data(visitedCities)
        .join("circle")
        .attr("class", "visited-city")
        .attr("cx", d => projection([d.lon, d.lat])[0])
        .attr("cy", d => projection([d.lon, d.lat])[1])
        .attr("r", 2)
        .attr("fill", "#2563eb")
        .attr("stroke", "#0f1117")
        .attr("stroke-width", 0.5)
        .on("mouseenter", function(event, d) {
          const tip = document.getElementById("city-tooltip");
          tip.textContent = d.name;
          tip.style.display = "block";
          tip.style.left = (event.clientX + 12) + "px";
          tip.style.top  = (event.clientY -  8) + "px";
        })
        .on("mousemove", function(event) {
          const tip = document.getElementById("city-tooltip");
          tip.style.left = (event.clientX + 12) + "px";
          tip.style.top  = (event.clientY -  8) + "px";
        })
        .on("mouseleave", function() {
          document.getElementById("city-tooltip").style.display = "none";
        });

      const cities = [
        { name: "Duluth",      lat: 46.786, lon: -92.100 },
        { name: "St. Paul",    lat: 44.954, lon: -93.090 },
        { name: "Jacksonville",lat: 30.332, lon: -81.656 },
        { name: "Madison",    lat: 43.072, lon: -89.401 },
      ];

      svg.selectAll(".city")
        .data(cities)
        .join("circle")
        .attr("class", "city")
        .attr("cx", d => projection([d.lon, d.lat])[0])
        .attr("cy", d => projection([d.lon, d.lat])[1])
        .attr("r", 3)
        .attr("fill", "#f8fafc")
        .attr("stroke", "#0f1117")
        .attr("stroke-width", 0.8)
        .on("mouseenter", function(event, d) {
          const tip = document.getElementById("city-tooltip");
          tip.textContent = d.name.trim();
          tip.style.display = "block";
          tip.style.left = (event.clientX + 12) + "px";
          tip.style.top  = (event.clientY -  8) + "px";
        })
        .on("mousemove", function(event) {
          const tip = document.getElementById("city-tooltip");
          tip.style.left = (event.clientX + 12) + "px";
          tip.style.top  = (event.clientY -  8) + "px";
        })
        .on("mouseleave", function() {
          document.getElementById("city-tooltip").style.display = "none";
        });

      const usV = states.filter(d => visited.has(fipsToCode[String(+d.id)])).length;
      const caV = provinces.filter(d => visited.has(d.id.slice(3))).length;
      document.getElementById("stats").innerHTML =
        "<strong>" + (usV + caV) + "</strong> of " + (states.length + provinces.length) + " states &amp; provinces";
    });

    /* ── World map ───────────────────────────────────────────────────────────
       ISO 3166-1 numeric codes for visited countries
    ─────────────────────────────────────────────────────────────────────── */
    const visitedCountries = new Set([
      840,  // United States
      124,  // Canada
      484,  // Mexico
      380,  // Italy
      724,  // Spain
      250,  // France
      392,  // Japan
      352,  // Iceland
      554,  // New Zealand
       36,  // Australia
    ]);

    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
      .then(data => {
        const countries = topojson.feature(data, data.objects.countries);
        const wSvg  = d3.select("#world-svg");
        const wProj = d3.geoNaturalEarth1().fitSize([960, 500], {type: "Sphere"});
        const wPath = d3.geoPath(wProj);

        wSvg.append("path")
          .datum({type: "Sphere"})
          .attr("d", wPath)
          .attr("fill", "#0a0e18");

        wSvg.append("path")
          .datum(d3.geoGraticule10())
          .attr("d", wPath)
          .attr("fill", "none")
          .attr("stroke", "#161c30")
          .attr("stroke-width", 0.5);

        wSvg.selectAll(".country")
          .data(countries.features)
          .join("path")
          .attr("class", "country")
          .attr("d", wPath)
          .attr("fill", d => {
            const id = +d.id;
            if (id === 250) return "#1a1f2e"; // France rendered separately below
            return visitedCountries.has(id) ? "#38bdf8" : "#1a1f2e";
          })
          .attr("stroke", "#2a3050")
          .attr("stroke-width", 0.3);

        // Metropolitan France only — filters out French Guiana (lon < −10°)
        const france = countries.features.find(d => +d.id === 250);
        if (france && france.geometry.type === "MultiPolygon") {
          france.geometry.coordinates
            .filter(poly => poly[0][0][0] > -10)
            .forEach(poly => {
              wSvg.append("path")
                .datum({ type: "Feature", geometry: { type: "Polygon", coordinates: poly } })
                .attr("d", wPath)
                .attr("fill", "#38bdf8")
                .attr("stroke", "#2a3050")
                .attr("stroke-width", 0.3);
            });
        }

        wSvg.append("path")
          .datum({type: "Sphere"})
          .attr("d", wPath)
          .attr("fill", "none")
          .attr("stroke", "#2a3050")
          .attr("stroke-width", 0.8);

        document.getElementById("world-stats").innerHTML =
          "<strong>" + visitedCountries.size + "</strong> of " + countries.features.length + " countries";
      });
  </script>
</body>
</html>
